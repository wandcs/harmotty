name: Public Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-policy:
    name: Source policy and PowerShell syntax
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run public-source checks
        shell: pwsh
        run: ./tools/check-public-source.ps1

  web-terminal:
    name: Web terminal policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run policy tests
        run: node tools/web-terminal/test-terminal-policy.mjs

  rust-core:
    name: Rust formatting, lint and core tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --manifest-path harmotty_ssh/Cargo.toml --all -- --check
      - name: Lint pure core
        run: cargo clippy --locked --manifest-path harmotty_ssh/Cargo.toml -p harmotty-ssh-core --all-targets -- -D warnings
      - name: Test pure core
        run: cargo test --locked --manifest-path harmotty_ssh/Cargo.toml -p harmotty-ssh-core
