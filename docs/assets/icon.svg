<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">LeanTTY refined app icon</title>
  <desc id="desc">A full-bleed HarmonyOS terminal icon layer with a grayscale status rail and a mint L followed by a white prompt chevron.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1F"/>
      <stop offset="0.52" stop-color="#151519"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="rail" x1="176" y1="0" x2="848" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E2E5"/>
      <stop offset="0.44" stop-color="#929399"/>
      <stop offset="1" stop-color="#414249"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="354" x2="0" y2="704" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9BE8D6"/>
      <stop offset="1" stop-color="#55C7A6"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="439" x2="0" y2="623" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E9EC"/>
    </linearGradient>
  </defs>

  <!-- HarmonyOS applies the launcher mask. Keep both icon layers square and full-bleed. -->
  <g id="background">
    <rect width="1024" height="1024" fill="url(#surface)"/>
  </g>

  <g id="foreground">
    <rect x="176" y="176" width="672" height="44" rx="22" fill="url(#rail)"/>
    <g fill="url(#accent)">
      <rect x="220" y="354" width="68" height="350" rx="12"/>
      <rect x="220" y="636" width="232" height="68" rx="12"/>
    </g>
    <path d="M506 439L712 531L506 623" fill="none" stroke="url(#prompt)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
