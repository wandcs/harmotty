[package]
name        = "leantty-ssh-core"
version     = "1.0.1"
edition     = "2021"
license     = "Apache-2.0"
description = "Pure Rust SSH client core for LeanTTY"
repository  = "https://github.com/wandcs/leantty"
authors     = ["LeanTTY Contributors"]

[dependencies]
russh = { version = "0.62", default-features = false, features = ["ring"] }
rand = { version = "0.10", features = ["sys_rng"] }
zeroize = "1"
